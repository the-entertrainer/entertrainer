version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns:
          - nuxt
          - '@nuxt/*'
          - nitropack
      vite:
        patterns:
          - vite
          - '@vitejs/*'
    commit-message:
      prefix: chore
      include: scope
