<!--
  Pre-boot splash. Inlined into index.html at build time. This is deliberately
  distinct from the site mark: an editorial workspace assembles into one clear
  learning card before the Vue application mounts.
-->

  <div class="boot__stage">
    <svg class="boot__desk" viewBox="0 0 250 154" aria-hidden="true">
      <ellipse class="boot__shadow" cx="125" cy="132" rx="82" ry="10" fill="#D9D4C9"/>
      <g class="boot__sheet">
        <path d="M57 22h104l30 30v74H57z" fill="#FFFDF7" stroke="#171717" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M161 22v30h30" fill="#EEE9DD" stroke="#171717" stroke-width="2.5" stroke-linejoin="round"/>
        <path class="boot__line boot__line--1" d="M79 65h75" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
        <path class="boot__line boot__line--2" d="M79 78h51" stroke="#6B6861" stroke-width="3" stroke-linecap="round"/>
        <path class="boot__line boot__line--3" d="M79 91h66" stroke="#6B6861" stroke-width="3" stroke-linecap="round"/>
        <rect class="boot__highlight" x="72" y="57" width="90" height="16" rx="3" fill="#E8B933"/>
      </g>
      <g class="boot__note-card">

        <path d="M170 84l13-10" stroke="#E35B4F" stroke-width="4" stroke-linecap="round"/>

    </svg>
    <div class="boot__word" aria-label="entertrainer">entertrainer</div>
    <p class="boot__note">putting the pieces together</p>
  </div>
</div>

<style>

  .boot__highlight { opacity: 0; transform-box: fill-box; transform-origin: left; animation: boot-highlight 460ms cubic-bezier(.16, 1, .3, 1) 310ms both; }

  @keyframes boot-shadow { from { opacity: 0; transform: scaleX(.55); } to { opacity: .65; transform: scaleX(1); } }

</style>
