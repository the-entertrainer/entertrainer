<style>
.boot{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;background:#fff;color:#161618;font-family:Arial,"Helvetica Neue",sans-serif}.boot__stage{position:relative;z-index:1;display:grid;place-items:center;width:min(360px,82vw)}.boot__brand-shell{position:relative;display:grid;place-items:center;min-height:58px;padding:12px 16px;opacity:0;transform:translate3d(0,18px,0) scale(.94);animation:boot-shell 680ms cubic-bezier(.05,.7,.1,1) 140ms both}.boot__brand{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;color:#161618;line-height:1}.boot__signal{position:relative;display:inline-flex;align-items:stretch;gap:2px;height:31px;padding:3px;overflow:hidden;background:#161618;border-radius:3px;box-shadow:8px 8px 0 #cdddf4}.boot__signal i{--d:0ms;display:block;width:4px;background:#4e28d8;transform-origin:center bottom;animation:boot-bar 520ms cubic-bezier(.16,1.08,.32,1) var(--d) both}.boot__signal i:nth-child(2){--d:55ms;background:#6458e4}.boot__signal i:nth-child(3){--d:110ms;background:#5d79e9}.boot__signal i:nth-child(4){--d:165ms;background:#5299e8}.boot__signal i:nth-child(5){--d:220ms;background:#8bc5f2}.boot__word{overflow:hidden;font-size:34px;font-weight:720;letter-spacing:-.055em;animation:boot-word 640ms cubic-bezier(.16,1,.3,1) 680ms both}.boot__glint{position:absolute;z-index:2;inset:10px 8px;pointer-events:none;background:linear-gradient(104deg,transparent 43%,rgb(255 255 255/.8) 50%,transparent 57%);mix-blend-mode:screen;transform:translateX(-145%);animation:boot-glint 560ms cubic-bezier(.2,.8,.2,1) 1580ms both}html[data-theme=dark] .boot{background:#0b0b0c;color:#f4f4f2}html[data-theme=dark] .boot__brand{color:#f4f4f2}html[data-theme=dark] .boot__signal{box-shadow:8px 8px 0 #242a3b}@keyframes boot-shell{to{opacity:1;transform:none}}@keyframes boot-bar{from{opacity:0;transform:translateY(18px) scaleY(.3)}72%{opacity:1;transform:translateY(-2px) scaleY(1.04)}to{opacity:1;transform:none}}@keyframes bo
