<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="dtTitle dtDesc">
  <title id="dtTitle">Dual-task attention budget: truth-telling versus lying</title>
  <desc id="dtDesc">An original diagram. Two panels compare spare attention under a concurrent tracking task. Truth-telling leaves more bandwidth for the secondary task; lying consumes more of the same limited budget, so tracking and story consistency compete.</desc>
  <rect x="0" y="0" width="820" height="360" fill="#fffaf0"/>

  <text x="40" y="36" font-family="DM Mono, monospace" font-size="12" font-weight="700" letter-spacing="1.2" fill="#625c52">SAME INTERVIEW + SAME SECONDARY TASK</text>
  <text x="40" y="58" font-family="DM Sans, Arial, sans-serif" font-size="15" fill="#49433b">Attention is a shared budget. Fabrication spends more of it.</text>

  <!-- Truth panel -->
  <rect x="40" y="88" width="350" height="210" fill="#fffaf0" stroke="#15120f" stroke-width="2.5" rx="10"/>
  <text x="60" y="118" font-family="DM Mono, monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#625c52">TRUTH-TELLING</text>
  <text x="60" y="148" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#15120f">Retrieve what happened</text>

  <!-- Budget bars truth -->
  <text x="60" y="186" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#49433b">Story</text>
  <rect x="120" y="174" width="240" height="16" fill="#efe8da" stroke="#15120f" stroke-width="1.5"/>
  <rect x="120" y="174" width="110" height="16" fill="#15120f"/>
  <text x="60" y="220" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#49433b">Tracking</text>
  <rect x="120" y="208" width="240" height="16" fill="#efe8da" stroke="#15120f" stroke-width="1.5"/>
  <rect x="120" y="208" width="150" height="16" fill="#1a56db"/>
  <text x="60" y="258" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#15120f">More spare capacity for the mouse task.</text>

  <!-- Lie panel -->
  <rect x="430" y="88" width="350" height="210" fill="#fffaf0" stroke="#15120f" stroke-width="2.5" rx="10"/>
  <text x="450" y="118" font-family="DM Mono, monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#625c52">LYING</text>
  <text x="450" y="148" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#15120f">Suppress + invent + monitor</text>

  <text x="450" y="186" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#49433b">Story</text>
  <rect x="510" y="174" width="240" height="16" fill="#efe8da" stroke="#15120f" stroke-width="1.5"/>
  <rect x="510" y="174" width="195" height="16" fill="#15120f"/>
  <text x="450" y="220" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#49433b">Tracking</text>
  <rect x="510" y="208" width="240" height="16" fill="#efe8da" stroke="#15120f" stroke-width="1.5"/>
  <rect x="510" y="208" width="70" height="16" fill="#1a56db"/>
  <text x="450" y="258" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#15120f">Consistency and tracking compete.</text>

  <text x="40" y="334" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#49433b">Inspired by dual-task findings: under concurrent demand, fabrication and consistency share one limited budget.</text>
</svg>
